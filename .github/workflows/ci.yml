name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run behavior tests
        run: python -m pytest -q

      - name: Run offline evaluation
        env:
          GROQ_API_KEY: ""
        run: python -m eval.run_cases

      - name: Enforce answer-quality benchmark
        run: python -m eval.answer_quality_evaluation --enforce-target

      - name: Validate STT benchmark manifest
        run: python -m eval.run_stt_cases --validate-only

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate vision benchmark manifest
        working-directory: frontend
        run: npm run eval:vision -- --validate-only

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Test audio turn evaluator
        run: node --test eval/audio_evaluation.test.js

      - name: Run audio turn evaluation
        run: node eval/run_audio_cases.js

      - name: Build frontend
        working-directory: frontend
        run: npm run build
